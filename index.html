<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gesundheitskosten">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>Meine Gesundheitskosten</title>
  <style>
    :root { color-scheme: light; --paper:#f8f8f5; --ink:#20211f; --muted:#70736e; --line:#e5e6e0; --green:#307966; --green-dark:#286956; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#eceeea; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; }
    .phone { width:100%; max-width:520px; min-height:100svh; margin:auto; background:var(--paper); padding:calc(env(safe-area-inset-top) + 54px) 28px calc(env(safe-area-inset-bottom) + 24px); display:flex; flex-direction:column; }
    h1 { font-size:36px; line-height:1.1; letter-spacing:-1.1px; margin:0 0 30px; font-weight:650; }
    .monthbar { display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; margin:0 -3px 35px; text-align:center; }
    .iconbtn { border:0; background:transparent; height:44px; width:44px; border-radius:50%; display:grid; place-items:center; cursor:pointer; }
    .iconbtn:active { background:#e9ece7; }
    .month-name { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; font-size:27px; font-weight:620; white-space:nowrap; }
    .month-name svg { width:20px; height:20px; }
    .current-month { align-self:center; justify-self:center; margin:-22px 0 22px; padding:8px 14px; border:1px solid #b8d2c8; border-radius:18px; background:transparent; color:var(--green); font-size:14px; font-weight:600; cursor:pointer; }
    .current-month[hidden] { display:none; }
    .totals { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px; }
    .total-label { color:var(--muted); font-size:18px; margin-bottom:7px; }
    .total-value { font-size:38px; letter-spacing:-1px; line-height:1.05; font-weight:520; white-space:nowrap; }
    .list { border-top:1px solid var(--line); }
    .item { min-height:88px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:minmax(0,1fr) auto 36px; gap:12px; align-items:center; }
    .item-name { font-size:20px; font-weight:550; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item-date { margin-top:3px; color:var(--muted); font-size:18px; }
    .item-amount { font-size:20px; white-space:nowrap; }
    .more { font-size:25px; line-height:1; letter-spacing:2px; }
    .empty { text-align:center; color:var(--muted); padding:32px 12px; border-bottom:1px solid var(--line); }
    .spacer { flex:1; min-height:24px; }
    .actions { display:grid; grid-template-columns:76px 1fr; gap:16px; padding-top:24px; }
    .backup-link { display:block; align-self:center; margin:12px auto 0; padding:8px 12px; border:0; background:transparent; color:var(--green); font-size:14px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
    .mic { width:76px; height:76px; border:1.5px solid var(--green); border-radius:22px; color:var(--green); background:transparent; display:grid; place-items:center; }
    .add { height:76px; border:0; border-radius:22px; color:white; background:var(--green); font-size:21px; font-weight:550; cursor:pointer; }
    .add:active { background:var(--green-dark); }
    .mic svg { width:27px; height:27px; }
    dialog { border:0; border-radius:24px; padding:26px; width:min(440px,calc(100% - 32px)); box-shadow:0 20px 70px #17221f30; color:var(--ink); }
    dialog::backdrop { background:#11171470; backdrop-filter:blur(3px); }
    .form-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
    .form-head h2 { margin:0; font-size:24px; }
    .close { border:0; background:#f0f1ed; width:36px; height:36px; border-radius:50%; font-size:22px; }
    label { display:block; font-size:14px; font-weight:600; margin:15px 0 7px; }
    input { width:100%; border:1px solid #d9dcd5; border-radius:12px; padding:13px 14px; background:white; outline:none; }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px #30796620; }
    .save { width:100%; margin-top:22px; border:0; background:var(--green); color:white; padding:15px; border-radius:14px; font-weight:600; }
    .backup-copy { color:var(--muted); line-height:1.45; margin:4px 0 18px; }
    .backup-action { width:100%; margin:7px 0; border:1px solid #b8d2c8; background:transparent; color:var(--green); padding:13px 14px; border-radius:14px; font-weight:600; }
    .toast { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 118px); left:50%; transform:translate(-50%,12px); background:#232925; color:white; padding:12px 18px; border-radius:20px; opacity:0; pointer-events:none; transition:.2s; white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media(min-width:600px) { .phone { min-height:860px; margin:24px auto; border-radius:38px; box-shadow:0 12px 50px #26332a1c; padding-top:64px; } body { padding:1px 0; } }
    @media(max-height:820px) { .phone { padding-top:calc(env(safe-area-inset-top) + 32px); } h1 { margin-bottom:22px; } .monthbar { margin-bottom:26px; } .totals { margin-bottom:22px; } .item { min-height:76px; } }
  </style>
</head>
<body>
  <main class="phone" aria-label="Medikamenten-Ausgaben">
    <h1>Meine Gesundheitskosten</h1>
    <section class="monthbar" aria-label="Monat auswählen">
      <button class="iconbtn" id="prev" aria-label="Vorheriger Monat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="iconbtn month-name" id="monthPicker" aria-label="Monat auswählen"><span id="monthLabel"></span><svg viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="iconbtn" id="next" aria-label="Nächster Monat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="m9.5 5 7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </section>
    <button class="current-month" id="currentMonth" hidden>Zurück zum aktuellen Monat</button>
    <section class="totals" aria-label="Ausgabenübersicht">
      <div><div class="total-label">Summe Monat</div><div class="total-value" id="monthTotal">0,00 €</div></div>
      <div><div class="total-label">Summe Jahr</div><div class="total-value" id="yearTotal">0,00 €</div></div>
    </section>
    <section class="list" id="list" aria-label="Medikamentenausgaben"></section>
    <div class="spacer"></div>
    <section class="actions">
      <button class="mic" id="voice" aria-label="Spracheingabe"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-3 0h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="add" id="add">Ausgabe hinzufügen</button>
    </section>
    <button class="backup-link" id="backupOpen">Daten sichern oder übertragen</button>
  </main>
  <dialog id="entryDialog">
    <form id="entryForm">
      <div class="form-head"><h2>Ausgabe hinzufügen</h2><button class="close" type="button" id="close" aria-label="Schließen">×</button></div>
      <label for="name">Medikament</label><input id="name" required placeholder="Name des Medikaments" autocomplete="off">
      <label for="date">Datum</label><input id="date" type="date" required>
      <label for="amount">Betrag in Euro</label><input id="amount" type="number" required min="0.01" step="0.01" inputmode="decimal" placeholder="0,00">
      <button class="save" type="submit">Speichern</button>
    </form>
  </dialog>
  <dialog id="backupDialog">
    <div class="form-head"><h2>Daten sichern</h2><button class="close" type="button" id="backupClose" aria-label="Schließen">×</button></div>
    <p class="backup-copy">Die Einträge bleiben auf diesem Gerät. Für ein neues iPhone kannst du eine Sicherungsdatei herunterladen und dort wieder einspielen.</p>
    <button class="save" type="button" id="exportData">Sicherung herunterladen</button>
    <button class="backup-action" type="button" id="importData">Sicherung einspielen</button>
    <input id="backupFile" type="file" accept="application/json,.json" hidden>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    const fallback = 'medikamenten-ausgaben-v1';
    let entries = [];
    try { entries = JSON.parse(localStorage.getItem(fallback) || '[]'); } catch {}
    let shown = new Date(); shown.setDate(1);
    const euros = n => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    function render() {
      document.getElementById('monthLabel').textContent = `${monthNames[shown.getMonth()]} ${shown.getFullYear()}`;
      const now = new Date();
      document.getElementById('currentMonth').hidden = shown.getFullYear() === now.getFullYear() && shown.getMonth() === now.getMonth();
      const monthKey = `${shown.getFullYear()}-${String(shown.getMonth()+1).padStart(2,'0')}`;
      const yearKey = String(shown.getFullYear());
      const filtered = entries.filter(e => e.date.startsWith(monthKey)).sort((a,b)=>b.date.localeCompare(a.date));
      document.getElementById('monthTotal').textContent = euros(filtered.reduce((s,e)=>s+Number(e.amount),0));
      document.getElementById('yearTotal').textContent = euros(entries.filter(e=>e.date.startsWith(yearKey)).reduce((s,e)=>s+Number(e.amount),0));
      const list = document.getElementById('list'); list.innerHTML = '';
      if (!filtered.length) {
        for (let i=0;i<7;i++) {
          const row=document.createElement('div'); row.className='item';
          row.innerHTML=`<div><div class="item-name">Medikament ${String.fromCharCode(65+i)}</div><div class="item-date">[Datum]</div></div><div class="item-amount">00,00 €</div><span class="more" aria-hidden="true">···</span>`;
          list.append(row);
        }
      } else {
        filtered.forEach(e => {
          const row=document.createElement('div'); row.className='item';
          const date=new Date(`${e.date}T12:00:00`).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
          row.innerHTML=`<div><div class="item-name"></div><div class="item-date">${date}</div></div><div class="item-amount">${euros(Number(e.amount))}</div><button class="iconbtn more" aria-label="${e.name} löschen">···</button>`;
          row.querySelector('.item-name').textContent=e.name;
          row.querySelector('button').addEventListener('click',()=>{ if(confirm(`„${e.name}“ löschen?`)){entries=entries.filter(x=>x.id!==e.id);persist();} });
          list.append(row);
        });
      }
    }
    function persist(){ localStorage.setItem(fallback,JSON.stringify(entries)); render(); }
    const backupDialog=document.getElementById('backupDialog');
    document.getElementById('backupOpen').addEventListener('click',()=>backupDialog.showModal());
    document.getElementById('backupClose').addEventListener('click',()=>backupDialog.close());
    document.getElementById('exportData').addEventListener('click',()=>{
      const backup={app:'Meine Gesundheitskosten',version:1,createdAt:new Date().toISOString(),entries};
      const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));
      const link=document.createElement('a'); link.href=url; link.download=`gesundheitskosten-sicherung-${ymd(new Date())}.json`; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
    document.getElementById('importData').addEventListener('click',()=>document.getElementById('backupFile').click());
    document.getElementById('backupFile').addEventListener('change',async event=>{
      const file=event.target.files[0]; if(!file) return;
      try {
        const backup=JSON.parse(await file.text());
        const candidate=Array.isArray(backup)?backup:backup.entries;
        const valid=Array.isArray(candidate)&&candidate.every(e=>e&&typeof e.name==='string'&&e.name.trim()&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&Number.isFinite(Number(e.amount))&&Number(e.amount)>0);
        if(!valid) throw new Error('invalid backup');
        if(confirm(`Die Sicherung enthält ${candidate.length} Einträge. Sie ersetzt die vorhandenen Einträge auf diesem Gerät. Fortfahren?`)){
          entries=candidate.map(e=>({id:typeof e.id==='string'?e.id:crypto.randomUUID(),name:e.name,amount:Number(e.amount),date:e.date}));
          persist(); backupDialog.close(); toastMessage('Sicherung wurde eingespielt');
        }
      } catch { alert('Diese Datei ist keine gültige Sicherung für Meine Gesundheitskosten.'); }
      event.target.value='';
    });
    function toastMessage(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600);}
    const dialog=document.getElementById('entryDialog');
    document.getElementById('add').addEventListener('click',()=>{ document.getElementById('date').value=ymd(shown); dialog.showModal(); document.getElementById('name').focus(); });
    document.getElementById('close').addEventListener('click',()=>dialog.close());
    document.getElementById('entryForm').addEventListener('submit',event=>{event.preventDefault(); const name=document.getElementById('name').value.trim(), date=document.getElementById('date').value, amount=Number(document.getElementById('amount').value); entries.push({id:crypto.randomUUID(),name,date,amount}); persist(); shown=new Date(`${date}T12:00:00`); render(); dialog.close(); event.target.reset();});
    document.getElementById('prev').addEventListener('click',()=>{shown.setMonth(shown.getMonth()-1);render();});
    document.getElementById('next').addEventListener('click',()=>{shown.setMonth(shown.getMonth()+1);render();});
    document.getElementById('currentMonth').addEventListener('click',()=>{shown=new Date();shown.setDate(1);render();});
    document.getElementById('monthPicker').addEventListener('click',()=>{const d=prompt('Monat und Jahr eingeben (MM.JJJJ)',`${String(shown.getMonth()+1).padStart(2,'0')}.${shown.getFullYear()}`);if(d&&/^\d{1,2}\.\d{4}$/.test(d)){const [m,y]=d.split('.').map(Number);if(m>=1&&m<=12){shown=new Date(y,m-1,1);render();}}});
    document.getElementById('voice').addEventListener('click',()=>{const toast=document.getElementById('toast'); toast.textContent='Spracheingabe ist auf diesem Gerät nicht verfügbar';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600);});
    render();
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  </script>
</body>
</html>
